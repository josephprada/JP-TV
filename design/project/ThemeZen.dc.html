<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>JP-TV — Tema Zen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&amp;family=Geist+Mono:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a0c}
a{color:#f5f5f7}a:hover{color:#ffffff}
button:focus-visible,a:focus-visible{outline:2px solid #ffffff;outline-offset:4px;border-radius:12px}
@keyframes zn-twinkle{0%,100%{opacity:0.2}50%{opacity:1}}
@keyframes zn-meteor{0%{transform:translate(0,0) rotate(-38deg);opacity:0}3%{opacity:1}22%{transform:translate(1100px,-860px) rotate(-38deg);opacity:0}100%{transform:translate(1100px,-860px) rotate(-38deg);opacity:0}}
@keyframes zn-orb-1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,-40px) scale(1.08)}}
@keyframes zn-orb-2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,50px) scale(0.94)}}
@keyframes zn-orb-3{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,60px)}}
@keyframes zn-aurora{0%{transform:translate(0,0) scale(1)}100%{transform:translate(180px,-120px) scale(1.2)}}
@keyframes zn-in{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #0a0a0c; color: #f5f5f7; font-family: 'Geist', system-ui, sans-serif;">

  <!-- Wallpaper: Galaxia (same engine as the default theme) -->
  <sc-if value="{{isGalaxia}}" hint-placeholder-val="{{ true }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; background: linear-gradient(155deg, #0a0a0c 0%, #110d10 45%, #140a0b 100%);">
      <sc-for list="{{orbs}}" as="o" hint-placeholder-count="5">
        <span style="{{o}}"></span>
      </sc-for>
      <sc-for list="{{stars}}" as="s" hint-placeholder-count="40">
        <span style="{{s}}"></span>
      </sc-for>
      <sc-for list="{{meteors}}" as="m" hint-placeholder-count="4">
        <span style="{{m}}"></span>
      </sc-for>
    </div>
  </sc-if>

  <!-- Wallpaper: Aurora (soft moving color, no stars) -->
  <sc-if value="{{isAurora}}" hint-placeholder-val="{{ false }}">
    <div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden; background: #0b0b0e;">
      <span style="{{auroraA}}"></span>
      <span style="{{auroraB}}"></span>
      <span style="{{auroraC}}"></span>
    </div>
  </sc-if>

  <!-- Legibility scrim, left side only -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,5,7,0.62) 0%, rgba(5,5,7,0.28) 45%, rgba(5,5,7,0) 75%);"></div>

  <!-- Accordion list: selected app big, the rest small, centered on the selection -->
  <nav aria-label="Apps" style="position: absolute; left: 0; top: 0; width: 1200px; height: 1080px; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 20%, #000 80%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0%, #000 20%, #000 80%, transparent 100%);">
    <div style="{{listStyle}}">
      <sc-for list="{{apps}}" as="app" hint-placeholder-count="10">
        <button onClick="{{app.pick}}" aria-current="{{app.current}}" style="{{app.rowStyle}}">
          <span style="{{app.iconStyle}}">{{app.initial}}</span>
          <span style="display: flex; flex-direction: column; justify-content: center; min-width: 0;">
            <span style="{{app.nameStyle}}">{{app.name}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </nav>

  <!-- Brand, top-left -->
  <span style="position: absolute; left: 140px; top: 64px; font-weight: 600; font-size: 28px; letter-spacing: -0.02em; color: #f5f5f7; animation: zn-in 0.8s cubic-bezier(0.32,0.72,0,1) both;">JP-TV</span>

  <!-- Top-right: clock + quick links, no boxes -->
  <div style="position: absolute; right: 96px; top: 48px; display: flex; align-items: center; gap: 36px; animation: zn-in 0.8s 0.15s cubic-bezier(0.32,0.72,0,1) both;">
    <a href="Network.dc.html" aria-label="Ver detalles de red" style="min-height: 48px; display: flex; align-items: center; gap: 12px; color: rgba(245,245,247,0.78); text-decoration: none; font-weight: 400; font-size: 20px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0"></path><path d="M5.5 12a10 10 0 0 1 13 0"></path><path d="M9 15.5a5 5 0 0 1 6 0"></path><circle cx="12" cy="19" r="1"></circle></svg>
      [RED WI-FI]
    </a>
    <a href="Settings.dc.html" aria-label="Ajustes" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: rgba(245,245,247,0.78);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </a>
    <a href="Themes.dc.html" aria-label="Temas" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: rgba(245,245,247,0.78);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1.5"></circle><circle cx="17.5" cy="10.5" r="1.5"></circle><circle cx="8.5" cy="7.5" r="1.5"></circle><circle cx="6.5" cy="12.5" r="1.5"></circle><path d="M12 2a10 10 0 0 0 0 20c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3A4.7 4.7 0 0 0 22 10.7C22 5.9 17.5 2 12 2z"></path></svg>
    </a>
    <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
      <span style="font-weight: 300; font-size: 44px; line-height: 1; letter-spacing: -0.02em;">21:40</span>
      <span style="font-family: 'Geist Mono', monospace; font-weight: 400; font-size: 13px; letter-spacing: 0.2em; color: rgba(245,245,247,0.7);">SÁBADO · 8 NOV</span>
    </span>
  </div>

  <!-- Position, bottom-left -->
  <span style="position: absolute; left: 140px; bottom: 56px; font-family: 'Geist Mono', monospace; font-weight: 400; font-size: 14px; letter-spacing: 0.2em; color: rgba(245,245,247,0.6);">{{position}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e63329","options":["#e63329","#ff8a1f","#3d8bfd","#b26bff"],"section":"Tema"},"wallpaper":{"editor":"enum","default":"Galaxia","options":["Galaxia","Aurora"],"section":"Tema"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focus: 1 };
  }
  rgba(hex, a) {
    const h = (hex || '#e63329').replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  renderVals() {
    const accent = this.props.accent ?? '#e63329';
    const wallpaper = this.props.wallpaper ?? 'Galaxia';
    const list = [
      ['Xuper Hydra', '#7b5cff', '#ffffff'],
      ['YouTube', '#ff1f3d', '#ffffff'],
      ['Netflix', '#d81f26', '#ffffff'],
      ['Spotify', '#1ed760', '#06210f'],
      ['Prime Video', '#2bb5ee', '#041a26'],
      ['Disney+', '#1f46d6', '#ffffff'],
      ['Crunchyroll', '#f47521', '#1f0d02'],
      ['Plex', '#e5a00d', '#231800'],
      ['Ajustes', '#636366', '#ffffff'],
      ['Todas las apps', '#48484a', '#ffffff'],
    ];
    const focus = this.state.focus;
    const SMALL = 76;
    const BIG = 144;
    const ease = 'cubic-bezier(0.32,0.72,0,1)';
    const dur = '0.6s';
    const apps = list.map(([name, color, fg], i) => {
      const on = i === focus;
      const d = Math.abs(i - focus);
      const op = on ? 1 : d === 1 ? 0.66 : d === 2 ? 0.54 : 0.46;
      return {
        name,
        initial: name.replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase(),
        current: on ? 'true' : 'false',
        pick: () => this.setState({ focus: i }),
        rowStyle: 'display: flex; align-items: center; gap: ' + (on ? 32 : 24) + 'px; width: 1000px; height: ' + (on ? BIG : SMALL) + 'px; padding: 0 0 0 140px; box-sizing: border-box; background: none; border: 0; text-align: left; cursor: pointer; font-family: inherit; color: #f5f5f7; ' +
          'opacity: ' + op + '; transition: height ' + dur + ' ' + ease + ', gap ' + dur + ' ' + ease + ', opacity ' + dur + ' ' + ease + ';',
        iconStyle: 'flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 23%; font-weight: 600; letter-spacing: -0.02em; background: linear-gradient(160deg, ' + color + ' 0%, ' + color + 'cc 100%); color: ' + fg + '; ' +
          'width: ' + (on ? 112 : 48) + 'px; height: ' + (on ? 112 : 48) + 'px; font-size: ' + (on ? 40 : 18) + 'px; ' +
          'box-shadow: ' + (on ? '0 24px 60px ' + color + '66, 0 0 0 1px rgba(255,255,255,0.18) inset' : '0 0 0 1px rgba(255,255,255,0.1) inset') + '; ' +
          'transition: width ' + dur + ' ' + ease + ', height ' + dur + ' ' + ease + ', font-size ' + dur + ' ' + ease + ', box-shadow ' + dur + ' ' + ease + ';',
        nameStyle: 'white-space: nowrap; letter-spacing: ' + (on ? '-0.035em' : '-0.015em') + '; line-height: 1.05; font-weight: ' + (on ? 600 : 500) + '; ' +
          'font-size: ' + (on ? 56 : 32) + 'px; transition: font-size ' + dur + ' ' + ease + ', letter-spacing ' + dur + ' ' + ease + ';',

      };
    });
    // Keep the selected row at the vertical center of the 1080 frame.
    const offset = 540 - (focus * SMALL + BIG / 2);
    // Galaxia: same star/meteor/orb recipe as the default theme.
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const stars = Array.from({ length: 200 }, () => {
      const r = rnd() > 0.92 ? 1.4 : rnd() * 0.9 + 0.3;
      const bright = 0.35 + rnd() * 0.65;
      const isAccent = r > 1.1 && bright > 0.75;
      const color = isAccent ? this.rgba(accent, 0.9) : 'rgba(240,248,255,' + bright.toFixed(2) + ')';
      const dd = Math.max(1.5, r * 2.4).toFixed(1);
      return 'position: absolute; left: ' + (rnd() * 1920).toFixed(0) + 'px; top: ' + (rnd() * 1080).toFixed(0) + 'px; width: ' + dd + 'px; height: ' + dd + 'px; border-radius: 50%; background: ' + color + '; ' +
        (isAccent ? 'box-shadow: 0 0 ' + (r * 6).toFixed(0) + 'px ' + (r * 2).toFixed(0) + 'px ' + this.rgba(accent, 0.25) + '; ' : '') +
        'animation: zn-twinkle ' + (5.2 / (0.4 + rnd())).toFixed(1) + 's ' + (rnd() * 5).toFixed(1) + 's ease-in-out infinite;';
    });
    const meteorSpots = [[180, 620, 0], [520, 760, 2.3], [-40, 480, 4.1], [760, 900, 6.4]];
    const meteors = meteorSpots.map(([x, y, delay], i) =>
      'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + (150 + i * 20) + 'px; height: 2px; border-radius: 2px; transform-origin: 100% 50%; ' +
      'background: linear-gradient(90deg, ' + this.rgba(accent, 0) + ' 0%, ' + this.rgba(accent, 0.45) + ' 55%, rgba(255,220,215,0.85) 85%, #ffffff 100%); ' +
      'box-shadow: 0 0 8px ' + this.rgba(accent, 0.6) + '; animation: zn-meteor 8.6s ' + delay + 's cubic-bezier(0.3,0,0.7,1) infinite;');
    const orbSpec = [[1100, -200, 900, 0.30, 1, 8], [1400, 520, 700, 0.18, 2, 10], [300, 600, 800, 0.14, 3, 7], [800, 200, 520, 0.12, 1, 9], [1600, 80, 420, 0.16, 2, 8.5]];
    const orbs = orbSpec.map(([x, y, s, a, k, dur2]) =>
      'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + s + 'px; height: ' + s + 'px; border-radius: 50%; ' +
      'background: radial-gradient(circle, ' + this.rgba(accent, a) + ' 0%, ' + this.rgba(accent, 0) + ' 65%); filter: blur(30px); animation: zn-orb-' + k + ' ' + dur2 + 's ease-in-out infinite;');
    const blob = (x, y, s, c, a, secs, rev) =>
      'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + s + 'px; height: ' + s + 'px; border-radius: 50%; filter: blur(80px); ' +
      'background: radial-gradient(circle, ' + this.rgba(c, a) + ' 0%, ' + this.rgba(c, 0) + ' 68%); animation: zn-aurora ' + secs + 's ease-in-out infinite alternate' + (rev ? ' reverse' : '') + ';';
    return {
      isGalaxia: wallpaper === 'Galaxia',
      isAurora: wallpaper === 'Aurora',
      listStyle: 'position: absolute; left: 0; top: 0; width: 1000px; transform: translateY(' + offset + 'px); transition: transform ' + '0.6s ' + ease + ';',
      apps,
      stars,
      meteors,
      orbs,
      auroraA: blob(900, -240, 1100, accent, 0.5, 16, false),
      auroraB: blob(1200, 380, 900, '#3d8bfd', 0.32, 20, true),
      auroraC: blob(300, 560, 800, '#b26bff', 0.22, 18, false),
      position: String(focus + 1).padStart(2, '0') + ' / ' + String(list.length).padStart(2, '0'),
    };
  }
}
</script>
</body>
</html>
