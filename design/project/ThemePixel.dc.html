<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>JP-TV — Tema Pixel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1a1c2c}
a{color:#ffcd75}a:hover{color:#f4f4f4}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #1a1c2c; color: #f4f4f4; font-family: 'Press Start 2P', monospace;">

  <!-- Pixel-art video loop placeholder -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 360px; background: #29366f; border-top: 8px solid #3b5dc9;"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 160px; background: #257179; border-top: 8px solid #38b764;"></div>
  <span style="position: absolute; right: 64px; bottom: 190px; font-size: 14px; color: #94b0c2;">VIDEO PIXEL-ART EN BUCLE</span>

  <!-- HUD -->
  <div style="position: absolute; left: 64px; right: 64px; top: 56px; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 28px; color: #ffcd75;">P1 ★ JP-TV</span>
    <div style="display: flex; align-items: center; gap: 40px;">
      <a href="Network.dc.html" style="display: flex; align-items: center; gap: 16px; font-size: 18px; color: #a7f070; text-decoration: none;">WIFI
        <span style="display: flex; gap: 4px; align-items: flex-end;"><span style="width: 10px; height: 10px; background: #a7f070;"></span><span style="width: 10px; height: 18px; background: #a7f070;"></span><span style="width: 10px; height: 26px; background: #a7f070;"></span><span style="width: 10px; height: 34px; background: #333c57;"></span></span>
        12MS</a>
      <span style="font-size: 36px; color: #73eff7;">21:40</span>
      <a href="Settings.dc.html" aria-label="Ajustes" style="width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; background: #333c57; box-shadow: 6px 6px 0 #000; color: #f4f4f4; text-decoration: none; font-size: 22px;">⚙</a>
    </div>
  </div>

  <!-- Cartridge carousel -->
  <div style="position: absolute; left: 64px; right: 64px; top: 230px; display: flex; gap: 40px; align-items: flex-end;">
    <div style="width: 300px; height: 360px; background: #b13e53; box-shadow: 12px 12px 0 #000; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; box-sizing: border-box; transform: translateY(-40px); outline: 8px solid #ffcd75; outline-offset: 8px;">
      <span style="height: 150px; background: #5d275d;"></span>
      <span style="font-size: 26px; line-height: 1.4;">YOU<br>TUBE</span>
    </div>
    <div style="width: 240px; height: 300px; background: #3b5dc9; box-shadow: 12px 12px 0 #000; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box;">
      <span style="height: 110px; background: #29366f;"></span>
      <span style="font-size: 18px; line-height: 1.4;">NETFLIX</span>
    </div>
    <div style="width: 240px; height: 300px; background: #38b764; box-shadow: 12px 12px 0 #000; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; color: #1a1c2c;">
      <span style="height: 110px; background: #257179;"></span>
      <span style="font-size: 18px; line-height: 1.4;">SPOTIFY</span>
    </div>
    <div style="width: 240px; height: 300px; background: #ef7d57; box-shadow: 12px 12px 0 #000; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; color: #1a1c2c;">
      <span style="height: 110px; background: #b13e53;"></span>
      <span style="font-size: 18px; line-height: 1.4;">XUPER<br>HYDRA</span>
    </div>
    <div style="width: 240px; height: 300px; background: #566c86; box-shadow: 12px 12px 0 #000; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box;">
      <span style="height: 110px; background: #333c57;"></span>
      <span style="font-size: 18px; line-height: 1.4;">PRIME<br>VIDEO</span>
    </div>
  </div>

  <!-- Prompt -->
  <div style="position: absolute; left: 64px; bottom: 64px; display: flex; flex-direction: column; gap: 20px;">
    <span style="font-size: 44px; color: #ffcd75;">▶ YOUTUBE</span>
    <span style="font-size: 18px; color: #f4f4f4;">PULSA OK PARA JUGAR</span>
  </div>

  <!-- CRT scanlines -->
  <div style="position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 2px, rgba(0,0,0,0) 2px, rgba(0,0,0,0) 6px); pointer-events: none;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
