<script type="text/x-dc" data-dc-script="" data-props="{&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;JP-TV&quot;},&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focus: 1 };
  }
  renderVals() {
    const bulbs = Array.from({ length: 30 }, (_, i) =>
      'width: 16px; height: 16px; border-radius: 50%; background: #5a3a10; animation: cart-bulb 1.2s ' + ((i % 3) * 0.4).toFixed(1) + 's steps(1) infinite;');
    const list = [
      ['Xuper Hydra', '#7a2fa0', '#4d1a68', '#fff4d6'],
      ['YouTube', '#c0272d', '#85141a', '#fff4d6'],
      ['Netflix', '#b3121a', '#750b11', '#fff4d6'],
      ['Spotify', '#1f9d4d', '#126a31', '#fff4d6'],
      ['Prime Video', '#1d6fb8', '#124a7e', '#fff4d6'],
      ['Disney+', '#2a47b5', '#1a2c80', '#fff4d6'],
      ['Crunchyroll', '#f0a24a', '#d9741a', '#2a1400'],
      ['Plex', '#f2c744', '#d19a12', '#2a1f00'],
      ['Ajustes', '#5a5f6b', '#3a3e48', '#fff4d6'],
      ['Todas las apps', '#16897f', '#0e5f58', '#fff4d6'],
    ];
    const n = list.length;
    const focus = this.state.focus;
    const ease = 'cubic-bezier(0.32,0.72,0,1)';
    const go = (i) => this.setState({ focus: Math.max(0, Math.min(n - 1, i)) });
    const posters = list.map(([name, c1, c2, fg], i) => {
      const d = i - focus;
      const ad = Math.abs(d);
      const s = Math.sign(d);
      const on = d === 0;
      const x = on ? 0 : s * (270 + (ad - 1) * 120);
      const z = on ? 80 : -ad * 150;
      const ry = on ? 0 : -s * 52;
      const sc = on ? 1.12 : 1;
      const op = ad > 3 ? 0 : on ? 1 : 1 - ad * 0.16;
      const br = on ? 1 : Math.max(0.42, 0.7 - ad * 0.08);
      return {
        name,
        initial: name.charAt(0),
        sala: 'SALA ' + (i + 1),
        current: on ? 'true' : 'false',
        pick: () => go(i),
        btnStyle: 'position: absolute; left: 50%; top: 50%; width: 340px; height: 500px; margin: -250px 0 0 -170px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; font-family: inherit; color: #fff4d6; ' +
          'z-index: ' + (100 - ad) + '; opacity: ' + op + '; pointer-events: ' + (ad > 3 ? 'none' : 'auto') + '; filter: brightness(' + br + '); ' +
          'transform: translateX(' + x + 'px) translateZ(' + z + 'px) rotateY(' + ry + 'deg) scale(' + sc + '); ' +
          'transition: transform 0.7s ' + ease + ', opacity 0.7s ' + ease + ', filter 0.7s ' + ease + ';',
        frameStyle: 'position: absolute; inset: ' + (on ? '-26px' : '0px') + '; border-radius: 28px; border: 8px dotted #ffe08a; box-sizing: border-box; opacity: ' + (on ? 1 : 0) + '; ' +
          'box-shadow: 0 0 44px rgba(255,214,110,0.35), inset 0 0 30px rgba(255,214,110,0.15); transition: inset 0.6s ' + ease + ', opacity 0.5s ' + ease + '; ' +
          (on ? 'animation: cart-frame 1.2s steps(1) infinite;' : ''),
        faceStyle: 'position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; box-sizing: border-box; background: linear-gradient(180deg, #3a1418 0%, #12050a 100%); ' +
          'border: ' + (on ? '3px solid #ffe08a' : '2px solid rgba(246,196,83,0.5)') + '; box-shadow: 0 30px 50px rgba(0,0,0,0.5);',
        artStyle: 'position: relative; flex-shrink: 0; height: 300px; overflow: hidden; display: flex; align-items: center; justify-content: center; ' +
          'background: repeating-conic-gradient(from 0deg at 50% 72%, ' + c1 + ' 0deg 8deg, ' + c2 + ' 8deg 16deg);',
        initialStyle: 'font-family: "Limelight", serif; font-size: 170px; line-height: 1; color: ' + fg + '; text-shadow: 0 6px 0 rgba(0,0,0,0.3);',
      };
    });
    return {
      brand: this.props.brand ?? 'JP-TV',
      bulbs,
      posters,
      prev: () => go(focus - 1),
      next: () => go(focus + 1),
      selName: list[focus][0].toUpperCase(),
    };
  }
}
</script>
