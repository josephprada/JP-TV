<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>JP-TV — Tema Cartelera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Limelight&amp;family=Geist:wght@400;500&amp;family=Geist+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1c0a0c}
a{color:#f6c453}a:hover{color:#fff4d6}
button:focus-visible,a:focus-visible{outline:3px solid #ffe08a;outline-offset:4px;border-radius:14px}
@keyframes cart-bulb{0%,100%{background:#5a3a10;box-shadow:none}50%{background:#ffe08a;box-shadow:0 0 14px 4px rgba(255,214,110,0.7)}}
@keyframes cart-sway{0%{transform:rotate(-6deg)}100%{transform:rotate(6deg)}}
@keyframes cart-frame{0%,100%{border-color:#ffe08a}50%{border-color:#7a5518}}
@keyframes cart-rise{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: #1c0a0c; color: #fff4d6; font-family: 'Geist', system-ui, sans-serif;">

  <!-- Velvet folds -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, #240c0f 0px, #3a1418 60px, #240c0f 120px);"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(70% 60% at 50% 45%, rgba(28,10,12,0) 0%, rgba(14,4,6,0.8) 100%);"></div>

  <!-- Marquee -->
  <header style="position: absolute; left: 160px; right: 160px; top: 40px; padding: 20px 48px; border-radius: 28px; background: #2a0f12; border: 3px solid #f6c453; display: flex; flex-direction: column; align-items: center; gap: 12px; animation: cart-rise 0.7s cubic-bezier(0.16,1,0.3,1) both;">
    <div aria-hidden="true" style="display: flex; justify-content: space-between; width: 100%;">
      <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="30">
        <span style="{{b}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; align-items: baseline; justify-content: space-between; width: 100%;">
      <span style="font-family: 'Geist Mono', monospace; font-size: 16px; letter-spacing: 0.2em; color: #f6c453;">{{brand}} PRESENTA</span>
      <span style="font-family: 'Limelight', serif; font-size: 60px; letter-spacing: 0.08em; color: #ffe08a; text-shadow: 0 0 24px rgba(255,214,110,0.45);">ESTA NOCHE</span>
      <span style="font-family: 'Geist Mono', monospace; font-size: 16px; letter-spacing: 0.2em; color: #f6c453;">FUNCIÓN 21:40</span>
    </div>
    <div aria-hidden="true" style="display: flex; justify-content: space-between; width: 100%;">
      <sc-for list="{{bulbs}}" as="b" hint-placeholder-count="30">
        <span style="{{b}}"></span>
      </sc-for>
    </div>
  </header>

  <!-- Coverflow stage -->
  <nav aria-label="Apps" style="position: absolute; left: 0; right: 0; top: 230px; height: 740px; perspective: 1800px; perspective-origin: 50% 40%;">
    <!-- Spotlight cone from the lamp above the center poster -->
    <div aria-hidden="true" style="position: absolute; left: 50%; top: -10px; width: 960px; height: 740px; margin-left: -480px; clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); background: linear-gradient(180deg, rgba(255,230,160,0.36) 0%, rgba(255,230,160,0.05) 100%);"></div>
    <div aria-hidden="true" style="position: absolute; left: 50%; bottom: 6px; width: 820px; height: 90px; margin-left: -410px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,214,110,0.38) 0%, rgba(255,214,110,0) 70%);"></div>

    <sc-for list="{{posters}}" as="p" hint-placeholder-count="10">
      <button onClick="{{p.pick}}" aria-current="{{p.current}}" aria-label="{{p.name}}" style="{{p.btnStyle}}">
        <span style="{{p.frameStyle}}"></span>
        <span style="{{p.faceStyle}}">
          <span style="{{p.artStyle}}">
            <span style="{{p.initialStyle}}">{{p.initial}}</span>
          </span>
          <span style="display: flex; flex-direction: column; gap: 10px; padding: 18px 24px 22px;">
            <span style="font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: 0.2em; color: #f6c453;">{{p.sala}}</span>
            <span style="font-family: 'Limelight', serif; font-size: 38px; line-height: 1.05; color: #fff4d6;">{{p.name}}</span>
          </span>
        </span>
      </button>
    </sc-for>
  </nav>

  <!-- Arrows -->
  <button aria-label="App anterior" onClick="{{prev}}" style="position: absolute; left: 64px; top: 560px; width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(42,15,18,0.85); border: 3px solid #f6c453; color: #ffe08a; cursor: pointer;">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
  </button>
  <button aria-label="App siguiente" onClick="{{next}}" style="position: absolute; right: 64px; top: 560px; width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(42,15,18,0.85); border: 3px solid #f6c453; color: #ffe08a; cursor: pointer;">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </button>

  <!-- Footer ticket -->
  <footer style="position: absolute; left: 160px; right: 160px; bottom: 36px; display: flex; justify-content: space-between; align-items: center; font-family: 'Geist Mono', monospace; font-size: 16px; letter-spacing: 0.18em; color: #f6c453;">
    <a href="Network.dc.html" style="padding: 14px 24px; border-radius: 24px; border: 1px dashed #f6c453; text-decoration: none;">TAQUILLA · [RED WI-FI] · 12 MS</a>
    <span>EN CARTELERA: {{selName}}</span>
    <a href="Settings.dc.html" style="padding: 14px 24px; border-radius: 24px; border: 1px dashed #f6c453; text-decoration: none;">AJUSTES</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"text","default":"JP-TV"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focus: 1 };
  }
  renderVals() {
    const bulbs = Array.from({ length: 30 }, (_, i) =>
      'width: 16px; height: 16px; border-radius: 50%; background: #5a3a10; animation: cart-bulb 1.2s ' + ((i % 3) * 0.4).toFixed(1) + 's steps(1) infinite;');
    const list = [
      ['Xuper Hydra', '#7a2fa0', '#4d1a68', '#fff4d6'],
      ['YouTube', '#c0272d', '#85141a', '#fff4d6'],
      ['Netflix', '#b3121a', '#750b11', '#fff4d6'],
      ['Spotify', '#1f9d4d', '#126a31', '#fff4d6'],
      ['Prime Video', '#1d6fb8', '#124a7e', '#fff4d6'],
      ['Disney+', '#2a47b5', '#1a2c80', '#fff4d6'],
      ['Crunchyroll', '#f0a24a', '#d9741a', '#2a1400'],
      ['Plex', '#f2c744', '#d19a12', '#2a1f00'],
      ['Ajustes', '#5a5f6b', '#3a3e48', '#fff4d6'],
      ['Todas las apps', '#16897f', '#0e5f58', '#fff4d6'],
    ];
    const n = list.length;
    const focus = this.state.focus;
    const ease = 'cubic-bezier(0.32,0.72,0,1)';
    const go = (i) => this.setState({ focus: Math.max(0, Math.min(n - 1, i)) });
    const posters = list.map(([name, c1, c2, fg], i) => {
      const d = i - focus;
      const ad = Math.abs(d);
      const s = Math.sign(d);
      const on = d === 0;
      const x = on ? 0 : s * (270 + (ad - 1) * 120);
      const z = on ? 80 : -ad * 150;
      const ry = on ? 0 : -s * 52;
      const sc = on ? 1.12 : 1;
      const op = ad > 3 ? 0 : on ? 1 : 1 - ad * 0.16;
      const br = on ? 1 : Math.max(0.42, 0.7 - ad * 0.08);
      return {
        name,
        initial: name.charAt(0),
        sala: 'SALA ' + (i + 1),
        current: on ? 'true' : 'false',
        pick: () => go(i),
        btnStyle: 'position: absolute; left: 50%; top: 50%; width: 340px; height: 500px; margin: -250px 0 0 -170px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; font-family: inherit; color: #fff4d6; ' +
          'z-index: ' + (100 - ad) + '; opacity: ' + op + '; pointer-events: ' + (ad > 3 ? 'none' : 'auto') + '; filter: brightness(' + br + '); ' +
          'transform: translateX(' + x + 'px) translateZ(' + z + 'px) rotateY(' + ry + 'deg) scale(' + sc + '); ' +
          'transition: transform 0.7s ' + ease + ', opacity 0.7s ' + ease + ', filter 0.7s ' + ease + ';',
        frameStyle: 'position: absolute; inset: ' + (on ? '-26px' : '0px') + '; border-radius: 28px; border: 8px dotted #ffe08a; box-sizing: border-box; opacity: ' + (on ? 1 : 0) + '; ' +
          'box-shadow: 0 0 44px rgba(255,214,110,0.35), inset 0 0 30px rgba(255,214,110,0.15); transition: inset 0.6s ' + ease + ', opacity 0.5s ' + ease + '; ' +
          (on ? 'animation: cart-frame 1.2s steps(1) infinite;' : ''),
        faceStyle: 'position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; box-sizing: border-box; background: linear-gradient(180deg, #3a1418 0%, #12050a 100%); ' +
          'border: ' + (on ? '3px solid #ffe08a' : '2px solid rgba(246,196,83,0.5)') + '; box-shadow: 0 30px 50px rgba(0,0,0,0.5);',
        artStyle: 'position: relative; flex-shrink: 0; height: 300px; overflow: hidden; display: flex; align-items: center; justify-content: center; ' +
          'background: repeating-conic-gradient(from 0deg at 50% 72%, ' + c1 + ' 0deg 8deg, ' + c2 + ' 8deg 16deg);',
        initialStyle: 'font-family: "Limelight", serif; font-size: 170px; line-height: 1; color: ' + fg + '; text-shadow: 0 6px 0 rgba(0,0,0,0.3);',
      };
    });
    return {
      brand: this.props.brand ?? 'JP-TV',
      bulbs,
      posters,
      prev: () => go(focus - 1),
      next: () => go(focus + 1),
      selName: list[focus][0].toUpperCase(),
    };
  }
}
</script>
</body>
</html>
