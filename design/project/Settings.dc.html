body{margin:0;background:#0b0b0c}
a{color:#f53d31}a:hover{color:#f2efe9}
@keyframes jp-drift-a{0%{transform:translate(0,0) scale(1)}100%{transform:translate(260px,140px) scale(1.25)}}
@keyframes jp-drift-b{0%{transform:translate(0,0) scale(1.1)}100%{transform:translate(-320px,-120px) scale(0.9)}}
@keyframes jp-rise{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}
@keyframes jp-caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.st-card{padding:22px 24px;border-radius:26px;background:rgba(18,18,20,0.42);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(242,239,233,0.12);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06);display:flex;flex-direction:column;justify-content:space-between;gap:16px;color:#f2efe9;text-decoration:none;transition:transform 0.35s cubic-bezier(0.16,1,0.3,1),box-shadow 0.35s cubic-bezier(0.16,1,0.3,1)}
.st-card:hover,.st-card:focus-visible{transform:translateY(-4px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.1),0 0 0 1px rgba(245,61,49,0.6),0 18px 48px rgba(230,51,41,0.18);outline:none}
.st-ico{width:60px;height:60px;border-radius:18px;background:linear-gradient(160deg,rgba(230,51,41,0.32),rgba(230,51,41,0.1));border:1px solid rgba(245,61,49,0.35);display:flex;align-items:center;justify-content:center;color:#ff7a6e}
.st-status{display:flex;align-items:center;gap:10px;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:0.14em;color:rgba(242,239,233,0.78)}
.st-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.st-chip{padding:8px 16px;border-radius:14px;background:rgba(242,239,233,0.08);border:1px solid rgba(242,239,233,0.14);font-family:'Geist Mono',monospace;font-size:15px;letter-spacing:0.1em}
.st-val{font-family:'Geist Mono',monospace;font-size:13px;letter-spacing:0.14em;color:rgba(242,239,233,0.78)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
