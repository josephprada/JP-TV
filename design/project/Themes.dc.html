        (on ? 'transform: scale(1.02); background: rgba(5,5,6,0.7); border: 0; box-shadow: 0 0 0 2px rgba(245,61,49,0.8), 0 20px 60px rgba(230,51,41,0.3);' : 'background: rgba(18,18,20,0.45); border: 1px solid rgba(242,239,233,0.1);');
      out['badge' + i] = 'font-family: "Geist Mono", monospace; font-size: 12px; letter-spacing: 0.14em; ' + (on ? 'color: #f53d31;' : 'color: rgba(242,239,233,0.5);');
      out['label' + i] = on ? 'ACTIVO' : 'PROBAR';
    }
    return out;
  }
}
