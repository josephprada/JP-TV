<script type="text/x-dc" data-dc-script="" data-props="{&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;JP-TV&quot;,&quot;section&quot;:&quot;Tema&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e63329&quot;,&quot;options&quot;:[&quot;#e63329&quot;,&quot;#ff8a1f&quot;,&quot;#3d8bfd&quot;,&quot;#b26bff&quot;],&quot;section&quot;:&quot;Tema&quot;},&quot;font&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Anton&quot;,&quot;options&quot;:[&quot;Anton&quot;,&quot;Bebas Neue&quot;,&quot;Archivo Black&quot;,&quot;Space Grotesk&quot;,&quot;Instrument Serif&quot;],&quot;section&quot;:&quot;Tema&quot;},&quot;wallpaper&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Galaxia&quot;,&quot;options&quot;:[&quot;Brasas&quot;,&quot;Galaxia&quot;],&quot;section&quot;:&quot;Tema&quot;},&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focus: 0, top: 0 };
  }
  rgba(hex, a) {
    const h = (hex || '#e63329').replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  renderVals() {
    const accent = this.props.accent ?? '#e63329';
    const fontName = this.props.font ?? 'Anton';
    const display = "'" + fontName + "', 'Anton', sans-serif";
    const wallpaper = this.props.wallpaper ?? 'Galaxia';
    const apps = ['Xuper Hydra', 'YouTube', 'Netflix', 'Spotify', 'Prime Video', 'Disney+', 'Crunchyroll', 'Plex', 'Ajustes', 'Todas las apps'];
    const SIZE = 7;
    const { focus, top } = this.state;
    const move = (next) => {
      const f = Math.max(0, Math.min(apps.length - 1, next));
      let t = top;
      if (f < t) t = f;
      if (f >= t + SIZE) t = f - SIZE + 1;
      this.setState({ focus: f, top: t });
    };
    const ease = 'cubic-bezier(0.16,1,0.3,1)';
    const visible = apps.slice(top, top + SIZE).map((name, i) => {
      const idx = top + i;
      const on = idx === focus;
      return {
        name,
        initial: name.replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase(),
        pick: () => move(idx),
        rowStyle: 'height: 86px; display: flex; align-items: center; gap: 22px; padding: 0 18px; border-radius: 24px; text-align: left; cursor: pointer; font-family: inherit; border: 0; ' +
          'transition: transform 0.35s ' + ease + ', background 0.35s ' + ease + ', box-shadow 0.35s ' + ease + '; ' +
          'animation: jp-rise 0.7s ' + (0.15 + i * 0.06).toFixed(2) + 's ' + ease + ' both; ' +
          (on
            ? 'transform: scale(1.03); background: rgba(5,5,6,0.62); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: #f2efe9; box-shadow: 0 0 0 1px ' + this.rgba(accent, 0.7) + ', 0 18px 52px ' + this.rgba(accent, 0.3) + ';'
            : 'background: transparent; color: rgba(242,239,233,0.78);'),
        iconStyle: 'width: 54px; height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 16px; font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: 0.06em; ' +
          (on ? 'background: ' + accent + '; color: #0b0b0c;' : 'background: rgba(242,239,233,0.08); color: #f2efe9; border: 1px solid rgba(242,239,233,0.12);'),
      };
    });
    // Galaxia, as in JP-Wallet's galaxyEngine: density w*h/9000, radius 0.3–1.2 (8% at 1.4),
    // bright big stars tinted with the accent plus a 3x halo, sine twinkle at 0.4–1.4 speed.
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const stars = Array.from({ length: 230 }, () => {
      const r = rnd() > 0.92 ? 1.4 : rnd() * 0.9 + 0.3;
      const bright = 0.35 + rnd() * 0.65;
      const isAccent = r > 1.1 && bright > 0.75;
      const color = isAccent ? this.rgba(accent, 0.9) : 'rgba(240,248,255,' + bright.toFixed(2) + ')';
      const d = Math.max(1.5, r * 2.4).toFixed(1);
      return 'position: absolute; left: ' + (rnd() * 1920).toFixed(0) + 'px; top: ' + (rnd() * 1080).toFixed(0) + 'px; width: ' + d + 'px; height: ' + d + 'px; border-radius: 50%; background: ' + color + '; ' +
        (isAccent ? 'box-shadow: 0 0 ' + (r * 6).toFixed(0) + 'px ' + (r * 2).toFixed(0) + 'px ' + this.rgba(accent, 0.25) + '; ' : '') +
        'animation: jp-twinkle ' + (5.2 / (0.4 + rnd())).toFixed(1) + 's ' + (rnd() * 5).toFixed(1) + 's ease-in-out infinite;';
    });
    // Meteors: one every ~2 s on average, up to 4 alive, heading up-right with a white→accent tail.
    const meteorSpots = [[180, 620, 0], [520, 760, 2.3], [-40, 480, 4.1], [760, 900, 6.4]];
    const meteors = meteorSpots.map(([x, y, delay], i) =>
      'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + (150 + i * 20) + 'px; height: 2px; border-radius: 2px; transform-origin: 100% 50%; ' +
      'background: linear-gradient(90deg, ' + this.rgba(accent, 0) + ' 0%, ' + this.rgba(accent, 0.45) + ' 55%, rgba(255,220,215,0.85) 85%, #ffffff 100%); ' +
      'box-shadow: 0 0 8px ' + this.rgba(accent, 0.6) + '; animation: jp-meteor 8.6s ' + delay + 's cubic-bezier(0.3,0,0.7,1) infinite;');
    // Aurora orbs (5), floating 7–10 s like JP-Wallet's login.
    const orbSpec = [[1100, -200, 900, 0.30, 1, 8], [1400, 520, 700, 0.18, 2, 10], [300, 600, 800, 0.14, 3, 7], [800, 200, 520, 0.12, 1, 9], [1600, 80, 420, 0.16, 2, 8.5]];
    const orbs = orbSpec.map(([x, y, s, a, k, dur]) =>
      'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + s + 'px; height: ' + s + 'px; border-radius: 50%; ' +
      'background: radial-gradient(circle, ' + this.rgba(accent, a) + ' 0%, ' + this.rgba(accent, 0) + ' 65%); filter: blur(30px); animation: jp-orb-' + k + ' ' + dur + 's ease-in-out infinite;');
    const below = Math.max(0, apps.length - (top + SIZE));
    return {
      brand: this.props.brand ?? 'JP-TV',
      brandStyle: 'font-family: ' + display + '; font-size: 60px; line-height: 1.02; letter-spacing: -0.01em; color: ' + accent + ';',
      clockStyle: 'font-family: ' + display + '; font-size: 148px; line-height: 1.02; letter-spacing: -0.01em;',
      dateStyle: 'font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: 0.2em; color: ' + accent + ';',
      minuteStyle: 'display: block; width: 100%; height: 100%; background: ' + accent + '; transform-origin: left; animation: jp-minute 60s linear infinite;',
      isBrasas: wallpaper === 'Brasas',
      isGalaxia: wallpaper === 'Galaxia',
      orbA: 'position: absolute; width: 1100px; height: 1100px; left: 620px; top: -360px; border-radius: 50%; background: radial-gradient(circle, ' + this.rgba(accent, 0.55) + ' 0%, ' + this.rgba(accent, 0) + ' 65%); animation: jp-drift-a 24s cubic-bezier(0.45,0,0.55,1) infinite alternate;',
      orbC: 'position: absolute; width: 700px; height: 700px; left: 1250px; top: 120px; border-radius: 50%; background: radial-gradient(circle, ' + this.rgba(accent, 0.35) + ' 0%, ' + this.rgba(accent, 0) + ' 60%); animation: jp-drift-c 12s cubic-bezier(0.45,0,0.55,1) infinite alternate;',
      stars,
      meteors,
      orbs,
      total: apps.length,
      visible,
      up: () => move(focus - 1),
      down: () => move(focus + 1),
      aboveLabel: top ? top + ' ARRIBA' : 'INICIO',
      belowLabel: below ? below + ' MÁS' : 'FIN',
    };
  }
}
</script>
