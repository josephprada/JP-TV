<style>
body{margin:0;background:#030418}
a{color:#eaf2ff}a:hover{color:#ffffff}
button:focus-visible,a:focus-visible{outline:2px solid #ffffff;outline-offset:6px;border-radius:50%}
a:focus-visible{border-radius:12px}
@keyframes mv-flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-460}}
@keyframes mv-flow-trunk{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-720}}
@keyframes mv-twinkle{0%,100%{opacity:0.15}50%{opacity:1}}
@keyframes mv-neb{0%{transform:translate(0,0) scale(1)}100%{transform:translate(80px,-40px) scale(1.12)}}
@keyframes mv-spin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes mv-ripple{0%{transform:translate(-50%,-50%) scale(0.8);opacity:0.7}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
@keyframes mv-pulse{0%,100%{opacity:0.8}50%{opacity:1}}
@keyframes mv-in{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

  <div style="position: absolute; right: 96px; top: 48px; display: flex; align-items: center; gap: 32px; animation: mv-in 0.9s 0.12s cubic-bezier(0.16,1,0.3,1) both;">

      <svg width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0"></path><path d="M5.5 12a10 10 0 0 1 13 0"></path><path d="M9 15.5a5 5 0 0 1 6 0"></path><circle cx="12" cy="19" r="1"></circle></svg>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { focus: 1 };
  }
  renderVals() {
    const list = [
      ['Xuper Hydra', '#9d7bff'],
      ['YouTube', '#ff7aa8'],
      ['Netflix', '#ff6f91'],
      ['Spotify', '#6ff0b4'],
      ['Prime Video', '#6fc8ff'],
      ['Disney+', '#7a9bff'],
      ['Crunchyroll', '#ffb36f'],
      ['Plex', '#ffe07a'],
      ['Ajustes', '#b8c4ff'],
      ['Todas las apps', '#c58bff'],
    ];
    const n = list.length;
    const focus = this.state.focus;
    const STEP = 300;
    const ease = 'cubic-bezier(0.32,0.72,0,1)';
    const T = '0.7s ' + ease;
    const go = (i) => this.setState({ focus: Math.max(0, Math.min(n - 1, i)) });
    const center = 'position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none;';
    const bez = (p0, p1, p2, p3, t) => {
      const u = 1 - t;
      return [0, 1].map((k) => u * u * u * p0[k] + 3 * u * u * t * p1[k] + 3 * u * t * t * p2[k] + t * t * t * p3[k]);
    };
    const f = (v) => v.toFixed(1);
    const nodes = list.map(([name, tint], i) => {
      const on = i === focus;
      const d = Math.abs(i - focus);
      // Per-app branch, deterministic
      let sd = 97 + i * 131;
      const r = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
      const sign = i % 2 ? 1 : -1;
      const dx = sign * (120 + r() * 170);
      const P0 = [350, 600], P1 = [350 + dx * 0.05, 470], P2 = [350 + dx * 0.6, 250], P3 = [350 + dx, -40];
      const Q = bez(P0, P1, P2, P3, 0.42);
      const fx = dx * 0.55 + sign * 90;
      const F3 = [Q[0] + fx, Q[1] - 300];
      const upD = 'M' + P0.join(' ') + ' C' + P1.join(' ') + ', ' + P2.join(' ') + ', ' + P3.join(' ') +
        ' M' + f(Q[0]) + ' ' + f(Q[1]) + ' C' + f(Q[0] + fx * 0.15) + ' ' + f(Q[1] - 90) + ', ' + f(Q[0] + fx * 0.6) + ' ' + f(Q[1] - 190) + ', ' + f(F3[0]) + ' ' + f(F3[1]);
      const dd = -dx * 0.55;
      const D1 = [350 + dd * 0.05, 700], D2 = [350 + dd * 0.6, 880], D3 = [350 + dd, 1120];
      const downD = 'M350 600 C' + D1.map(f).join(' ') + ', ' + D2.map(f).join(' ') + ', ' + D3.map(f).join(' ');
      const twig = (p, base) => {
        let s = 'M' + f(p[0]) + ' ' + f(p[1]);
        let a = base;
        for (let k = 0; k < 4; k++) {
          a += (k % 2 ? 1 : -1) * (0.5 + r() * 0.4);
          const len = 14 + r() * 14;
          s += ' l' + f(Math.cos(a) * len) + ' ' + f(Math.sin(a) * len);
        }
        return s;
      };
      const twigs = [0.3, 0.58, 0.8].map((t) => twig(bez(P0, P1, P2, P3, t), -Math.PI / 2 + (r() > 0.5 ? 0.9 : -0.9)));
      twigs.push(twig(bez(Q, [Q[0] + fx * 0.15, Q[1] - 90], [Q[0] + fx * 0.6, Q[1] - 190], F3, 0.6), -Math.PI / 2 + sign * 0.8));
      twigs.push(twig(bez(P0, D1, D2, D3, 0.5), Math.PI / 2 + (r() > 0.5 ? 0.8 : -0.8)));
      const orb = on ? 132 : 52;
      return {
        name,
        tint,
        twigTint: on ? '#e3f0ff' : '#b8c8ff',
        initial: name.charAt(0),
        current: on ? 'true' : 'false',
        pick: () => go(i),
        upD,
        downD,
        twigD: twigs.join(' '),
        haloStyle: 'opacity: ' + (on ? 0.55 : 0) + '; transition: opacity ' + T + ';',
        coreStyle: 'stroke-width: ' + (on ? 2.8 : 1.1) + 'px; opacity: ' + (on ? 1 : d === 1 ? 0.32 : 0.2) + '; transition: opacity ' + T + ', stroke-width ' + T + ';',
        twigStyle: 'opacity: ' + (on ? 0.95 : 0.18) + '; transition: opacity ' + T + ';',
        fringeStyle: 'opacity: ' + (on ? 0.55 : 0) + '; transition: opacity ' + T + ';',
        flowStyle: 'opacity: ' + (on ? 1 : 0) + '; transition: opacity ' + T + '; animation: mv-flow 3.4s linear infinite;',
        bloomStyle: center + ' width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, ' + tint + '59 0%, ' + tint + '1f 35%, ' + tint + '00 68%); opacity: ' + (on ? 1 : 0) + '; transition: opacity ' + T + ';',
        streakSoftStyle: center + ' width: 1500px; height: 22px; border-radius: 50%; filter: blur(8px); background: linear-gradient(90deg, rgba(111,227,255,0) 0%, rgba(111,227,255,0.45) 40%, rgba(255,255,255,0.8) 50%, rgba(111,227,255,0.45) 60%, rgba(111,227,255,0) 100%); opacity: ' + (on ? 1 : 0) + '; transition: opacity ' + T + ';',
        streakStyle: center + ' width: 1300px; height: 2px; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, ' + tint + ' 35%, #ffffff 50%, ' + tint + ' 65%, rgba(255,255,255,0) 100%); opacity: ' + (on ? 0.9 : 0) + '; transition: opacity ' + T + ';',
        rippleA: center + ' width: 140px; height: 140px; border-radius: 50%; border: 1px solid ' + tint + '; opacity: 0; ' + (on ? 'animation: mv-ripple 3.2s ease-out infinite;' : ''),
        rippleB: center + ' width: 140px; height: 140px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.6); opacity: 0; ' + (on ? 'animation: mv-ripple 3.2s 1.6s ease-out infinite;' : ''),
        ringStyle: center + ' width: ' + (on ? 196 : 74) + 'px; height: ' + (on ? 196 : 74) + 'px; border-radius: 50%; border: 1px dashed rgba(255,255,255,' + (on ? 0.5 : 0.22) + '); animation: mv-spin ' + (on ? 22 : 60) + 's linear infinite; transition: width ' + T + ', height ' + T + ';',
        orbStyle: center + ' width: ' + orb + 'px; height: ' + orb + 'px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 500; ' +
          'font-size: ' + (on ? 56 : 21) + 'px; color: ' + (on ? '#ffffff' : tint) + '; ' +
          'background: ' + (on ? 'radial-gradient(circle at 34% 28%, rgba(255,255,255,0.9) 0%, ' + tint + ' 22%, rgba(18,22,92,0.96) 72%)' : 'radial-gradient(circle at 34% 28%, rgba(255,255,255,0.12) 0%, rgba(10,14,62,0.92) 60%)') + '; ' +
          'border: 1.5px solid ' + (on ? 'rgba(255,255,255,0.85)' : tint + 'b3') + '; ' +
          'box-shadow: 0 0 ' + (on ? 80 : 18) + 'px ' + tint + (on ? 'a6' : '55') + ', inset 0 0 ' + (on ? 30 : 10) + 'px rgba(255,255,255,' + (on ? 0.35 : 0.12) + '); ' +
          'text-shadow: ' + (on ? '0 2px 12px rgba(10,14,62,0.8)' : 'none') + '; ' +
          'transition: width ' + T + ', height ' + T + ', font-size ' + T + ', box-shadow ' + T + ', background ' + T + ';',
        labelStyle: 'position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none; top: ' + (on ? 60 + 66 + 40 : 60 + 26 + 18) + 'px; ' +
          'font-size: ' + (on ? 64 : 17) + 'px; font-weight: ' + (on ? 600 : 400) + '; letter-spacing: ' + (on ? '-0.035em' : '0.01em') + '; line-height: 1.05; ' +
          'color: ' + (on ? '#ffffff' : 'rgba(234,242,255,0.72)') + '; text-shadow: ' + (on ? '0 0 40px ' + tint + 'aa, 0 2px 18px rgba(3,4,24,0.8)' : '0 1px 8px rgba(3,4,24,0.9)') + '; ' +
          'transition: top ' + T + ', font-size ' + T + ', color ' + T + ';',
      };
    });
    // Braided main timeline
    const strand = (amp, freq, ph, off) => {
      let s = '';
      for (let x = -60; x <= 1980; x += 30) {
        const y = 600 + off + amp * Math.sin(x * freq + ph) + amp * 0.4 * Math.sin(x * freq * 2.3 + ph * 1.7);
        s += (s ? ' L' : 'M') + x + ' ' + y.toFixed(1);
      }
      return s;
    };
    const strandSpec = [[3, 0.004, 0, 0, 0.95, 2.6], [7, 0.003, 1.2, -2, 0.6, 1.4], [10, 0.0026, 2.4, 3, 0.5, 1.2], [5, 0.005, 4, 1, 0.7, 1], [12, 0.002, 0.7, -1, 0.42, 1.6]];
    const strandList = strandSpec.map(([a, fr, ph, off]) => strand(a, fr, ph, off));
    const strands = {};
    strandList.forEach((d, k) => { strands['s' + k] = d; });
    // Background
    let seed = 5;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const star = (big) => 'position: absolute; left: ' + Math.floor(rnd() * 2000) + 'px; top: ' + Math.floor(rnd() * 1080) + 'px; width: ' + big + 'px; height: ' + big + 'px; border-radius: 50%; ' +
      'background: ' + (rnd() > 0.75 ? '#ffb8ee' : '#d8e8ff') + '; ' + (big > 2 ? 'box-shadow: 0 0 6px rgba(200,220,255,0.8); ' : '') +
      'animation: mv-twinkle ' + (3 + rnd() * 5).toFixed(1) + 's ' + (rnd() * 5).toFixed(1) + 's ease-in-out infinite;';
    const starsFar = Array.from({ length: 90 }, () => star(rnd() > 0.8 ? 2 : 1));
    const starsNear = Array.from({ length: 26 }, () => star(3));
    const farList = Array.from({ length: 7 }, (_, k) => {
      const y0 = 80 + rnd() * 920, y1 = 80 + rnd() * 920;
      return 'M-90 ' + y0.toFixed(0) + ' C' + (400 + rnd() * 300).toFixed(0) + ' ' + (y0 + (rnd() - 0.5) * 500).toFixed(0) + ', ' + (1300 + rnd() * 300).toFixed(0) + ' ' + (y1 + (rnd() - 0.5) * 500).toFixed(0) + ', 2010 ' + y1.toFixed(0);
    });
    const farLines = {};
    farList.forEach((d, k) => { farLines['l' + k] = d; });
    const ticks = list.map(([name, tint], i) => {
      const on = i === focus;
      return {
        name,
        pick: () => go(i),
        btnStyle: 'position: absolute; left: ' + (i * (1000 / (n - 1)) - 22).toFixed(1) + 'px; top: 2px; width: 44px; height: 44px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 12px;',
        markStyle: 'position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 2px; width: ' + (on ? 4 : 2) + 'px; height: ' + (on ? 30 : 10) + 'px; ' +
          'background: ' + (on ? tint : 'rgba(220,232,255,0.5)') + '; box-shadow: ' + (on ? '0 0 14px ' + tint + ', 0 0 4px #ffffff' : 'none') + '; transition: height ' + T + ', width ' + T + ', background ' + T + ';',
      };
    });
    return {
      nodes,
      strands,
      trunkMain: strandList[0],
      fringe: strandList[2],
      starsFar,
      starsNear,
      farLines,
      ticks,
      starsFarStyle: 'position: absolute; left: -40px; top: 0; width: 2000px; height: 1080px; transform: translateX(' + (-focus * 5) + 'px); transition: transform 1.1s ' + ease + ';',
      starsNearStyle: 'position: absolute; left: -40px; top: 0; width: 2000px; height: 1080px; transform: translateX(' + (-focus * 14) + 'px); transition: transform 1.1s ' + ease + ';',
      farLinesStyle: 'position: absolute; left: -90px; top: 0; width: 2100px; height: 1080px; opacity: 0.8; transform: translateX(' + (-focus * 8) + 'px); transition: transform 1.1s ' + ease + ';',
      trackStyle: 'position: absolute; left: 0; top: 0; display: flex; transform: translateX(' + (960 - (focus * STEP + 150)) + 'px); transition: transform 0.7s ' + ease + ';',
      position: String(focus + 1).padStart(2, '0') + ' / ' + String(n).padStart(2, '0'),
    };
  }
}
</script>
