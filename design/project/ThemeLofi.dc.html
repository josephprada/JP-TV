<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>JP-TV — Tema Lo-fi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=DM+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1e1b3a}
a{color:#f2a65a}a:hover{color:#f6e7d0}
@keyframes lo-rain{0%{transform:translateY(-120px)}100%{transform:translateY(520px)}}
@keyframes lo-steam{0%{transform:translateY(0) scaleX(1);opacity:0}20%{opacity:0.7}100%{transform:translateY(-120px) scaleX(1.8);opacity:0}}
@keyframes lo-lamp{0%,100%{opacity:0.85}48%{opacity:0.85}50%{opacity:0.7}52%{opacity:0.88}}
@keyframes lo-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes lo-tail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes lo-grain{0%{transform:translate(0,0)}25%{transform:translate(-8px,6px)}50%{transform:translate(6px,-4px)}75%{transform:translate(-4px,-8px)}100%{transform:translate(0,0)}}
@keyframes lo-in{0%{opacity:0;transform:translateX(30px) rotate(var(--r,0deg))}100%{opacity:1;transform:translateX(0) rotate(var(--r,0deg))}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 1920px; height: 1080px; position: relative; overflow: hidden; background: linear-gradient(180deg, #2a2350 0%, #1e1b3a 60%, #17142c 100%); color: #f6e7d0; font-family: 'DM Mono', monospace;">

  <!-- Window -->
  <div style="position: absolute; left: 120px; top: 120px; width: 760px; height: 520px; border-radius: 24px; overflow: hidden; background: linear-gradient(180deg, #3b2d5c 0%, #7a4a72 55%, #f2a65a 100%); box-shadow: 0 0 0 18px #3a2d4a, 0 30px 80px rgba(0,0,0,0.5);">
    <span aria-hidden="true" style="position: absolute; left: 520px; top: 70px; width: 90px; height: 90px; border-radius: 50%; background: #f6e7d0; box-shadow: 0 0 60px rgba(246,231,208,0.6);"></span>
    <!-- skyline -->
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; display: flex; align-items: flex-end; gap: 6px;">
      <span style="width: 90px; height: 150px; background: #231c3d;"></span><span style="width: 70px; height: 200px; background: #2a2148;"></span><span style="width: 110px; height: 120px; background: #231c3d;"></span><span style="width: 60px; height: 180px; background: #2a2148;"></span><span style="width: 120px; height: 140px; background: #231c3d;"></span><span style="width: 80px; height: 210px; background: #2a2148;"></span><span style="width: 100px; height: 160px; background: #231c3d;"></span><span style="width: 90px; height: 130px; background: #2a2148;"></span>
    </div>
    <sc-for list="{{lights}}" as="l" hint-placeholder-count="10">
      <span aria-hidden="true" style="{{l}}"></span>
    </sc-for>
    <!-- rain -->
    <sc-for list="{{rain}}" as="r" hint-placeholder-count="20">
      <span aria-hidden="true" style="{{r}}"></span>
    </sc-for>
    <!-- window frame cross -->
    <span aria-hidden="true" style="position: absolute; left: 50%; top: 0; bottom: 0; width: 14px; margin-left: -7px; background: #3a2d4a;"></span>
    <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 50%; height: 14px; margin-top: -7px; background: #3a2d4a;"></span>
  </div>

  <!-- Desk -->
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 760px; bottom: 0; background: linear-gradient(180deg, #4a3047 0%, #331f33 100%);"></div>
  <!-- Lamp glow -->
  <div aria-hidden="true" style="position: absolute; left: 820px; top: 520px; width: 640px; height: 520px; border-radius: 50%; background: radial-gradient(ellipse, rgba(242,166,90,0.35) 0%, rgba(242,166,90,0) 65%); animation: lo-lamp 7s ease-in-out infinite;"></div>
  <div aria-hidden="true" style="position: absolute; left: 1080px; top: 560px; width: 140px; height: 80px; border-radius: 70px 70px 10px 10px; background: #e98ca8;"></div>
  <div aria-hidden="true" style="position: absolute; left: 1144px; top: 640px; width: 12px; height: 130px; background: #c9708c;"></div>
  <!-- Mug + steam -->
  <div aria-hidden="true" style="position: absolute; left: 860px; top: 700px; width: 90px; height: 90px; border-radius: 0 0 22px 22px; background: #f6e7d0;"></div>
  <div aria-hidden="true" style="position: absolute; left: 938px; top: 716px; width: 36px; height: 44px; border-radius: 0 22px 22px 0; border: 10px solid #f6e7d0; border-left: 0;"></div>
  <span aria-hidden="true" style="position: absolute; left: 885px; top: 670px; width: 16px; height: 50px; border-radius: 10px; background: rgba(246,231,208,0.5); filter: blur(6px); animation: lo-steam 3.2s ease-out infinite;"></span>
  <span aria-hidden="true" style="position: absolute; left: 912px; top: 676px; width: 14px; height: 44px; border-radius: 10px; background: rgba(246,231,208,0.5); filter: blur(6px); animation: lo-steam 3.2s 1.4s ease-out infinite;"></span>
  <!-- Sleeping cat -->
  <div aria-hidden="true" style="position: absolute; left: 300px; top: 690px; width: 230px; height: 90px; border-radius: 110px 110px 30px 30px; background: #1b1530;"></div>
  <div aria-hidden="true" style="position: absolute; left: 470px; top: 668px; width: 80px; height: 70px; border-radius: 50%; background: #1b1530;"></div>
  <span aria-hidden="true" style="position: absolute; left: 482px; top: 652px; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid #1b1530;"></span>
  <span aria-hidden="true" style="position: absolute; left: 516px; top: 652px; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 26px solid #1b1530;"></span>
  <span aria-hidden="true" style="position: absolute; left: 230px; top: 740px; width: 110px; height: 22px; border-radius: 12px; background: #1b1530; transform-origin: 100% 50%; animation: lo-tail 4s ease-in-out infinite;"></span>

  <!-- VHS stamp + clock -->
  <div style="position: absolute; left: 120px; top: 48px; display: flex; gap: 28px; align-items: baseline; font-size: 22px; letter-spacing: 0.14em; color: #f6e7d0;">
    <span><span style="color: #e98ca8; animation: lo-blink 1s steps(1) infinite;">▶</span> PLAY</span>
    <span>21:40 · SÁB 08 NOV</span>
  </div>

  <!-- Notebook with apps -->
  <div style="position: absolute; right: 120px; top: 110px; width: 640px; height: 700px; border-radius: 18px; background: repeating-linear-gradient(180deg, #f6e7d0 0px, #f6e7d0 62px, #d8c7ad 63px, #f6e7d0 64px); box-shadow: 0 30px 70px rgba(0,0,0,0.5); transform: rotate(1.5deg); padding: 56px 56px 0 92px; box-sizing: border-box; color: #2a2350;">
    <span aria-hidden="true" style="position: absolute; left: 64px; top: 0; bottom: 0; width: 2px; background: #e98ca8;"></span>
    <span style="font-family: 'Caveat', cursive; font-weight: 700; font-size: 56px; line-height: 1; color: #7a4a72;">{{brand}} — esta noche</span>
    <div style="display: flex; flex-direction: column; margin-top: 18px;">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="6">
        <button onClick="{{a.pick}}" style="{{a.style}}">{{a.mark}} {{a.name}}</button>
      </sc-for>
    </div>
  </div>

  <!-- Bottom bar -->
  <div style="position: absolute; left: 120px; right: 120px; bottom: 56px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; letter-spacing: 0.12em;">
    <span>lo-fi beats para mirar · [RED WI-FI] 12 ms</span>
    <a href="Settings.dc.html" style="padding: 14px 26px; border-radius: 26px; background: rgba(246,231,208,0.1); color: #f6e7d0; text-decoration: none;">ajustes</a>
  </div>

  <!-- Film grain -->
  <div aria-hidden="true" style="position: absolute; inset: -40px; background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 4px 4px; animation: lo-grain 0.8s steps(4) infinite; pointer-events: none;"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%); pointer-events: none;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"text","default":"JP-TV"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    let seed = 3;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const rain = Array.from({ length: 34 }, () =>
      'position: absolute; left: ' + (rnd() * 760).toFixed(0) + 'px; top: 0; width: 2px; height: ' + (30 + rnd() * 40).toFixed(0) + 'px; border-radius: 2px; background: rgba(220,215,255,0.45); animation: lo-rain ' + (0.7 + rnd() * 0.6).toFixed(2) + 's ' + (rnd() * 1.2).toFixed(2) + 's linear infinite;');
    const lights = Array.from({ length: 14 }, () =>
      'position: absolute; left: ' + (20 + rnd() * 720).toFixed(0) + 'px; top: ' + (330 + rnd() * 160).toFixed(0) + 'px; width: 8px; height: 10px; background: ' + (rnd() > 0.5 ? '#f2a65a' : '#f6e7d0') + '; opacity: 0.8;');
    const names = ['YouTube', 'Netflix', 'Spotify', 'Xuper Hydra', 'Prime Video', 'Disney+'];
    const apps = names.map((name, i) => {
      const on = i === this.state.sel;
      return {
        name,
        mark: on ? '✎' : '·',
        pick: () => this.setState({ sel: i }),
        style: 'height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 0; cursor: pointer; text-align: left; font-family: "Caveat", cursive; font-size: 44px; line-height: 1; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1); ' +
          'animation: lo-in 0.6s ' + (0.1 + i * 0.07).toFixed(2) + 's cubic-bezier(0.16,1,0.3,1) both; ' +
          (on ? 'background: rgba(242,166,90,0.45); color: #2a2350; font-weight: 700; border-radius: 10px; transform: translateX(10px);' : 'background: transparent; color: #4a3d6e; font-weight: 500;'),
      };
    });
    return { rain, lights, apps, brand: this.props.brand ?? 'JP-TV' };
  }
}
</script>
</body>
</html>
