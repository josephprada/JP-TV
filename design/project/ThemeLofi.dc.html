<script type="text/x-dc" data-dc-script="" data-props="{&quot;momento&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Auto&quot;,&quot;options&quot;:[&quot;Auto&quot;,&quot;Día&quot;,&quot;Noche&quot;],&quot;section&quot;:&quot;Tema&quot;},&quot;brand&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;JP-TV&quot;},&quot;$preview&quot;:{&quot;width&quot;:1920,&quot;height&quot;:1080}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  componentDidMount() { this._tick = setInterval(() => this.forceUpdate(), 60000); }
  componentWillUnmount() { clearInterval(this._tick); }
  phase() {
    const m = this.props.momento ?? 'Auto';
    const now = new Date();
    const h = now.getHours();
    const night = m === 'Noche' || (m === 'Auto' && (h >= 18 || h < 6));
    const clock = m === 'Auto' ? String(h).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') : (m === 'Noche' ? '21:40' : '10:30');
    const days = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
    const months = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
    const date = m === 'Auto' ? days[now.getDay()] + ' ' + String(now.getDate()).padStart(2, '0') + ' ' + months[now.getMonth()] : 'SÁB 08 NOV';
    return { night, clock, date };
  }
  renderVals() {
    const { night, clock, date } = this.phase();
    let seed = 3;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const rain = Array.from({ length: 34 }, () =>
      'position: absolute; left: ' + (rnd() * 760).toFixed(0) + 'px; top: 0; width: 2px; height: ' + (30 + rnd() * 40).toFixed(0) + 'px; border-radius: 2px; background: rgba(220,215,255,0.45); opacity: ' + (night ? 1 : 0) + '; transition: opacity 2s ease; animation: lo-rain ' + (0.7 + rnd() * 0.6).toFixed(2) + 's ' + (rnd() * 1.2).toFixed(2) + 's linear infinite;');
    const lights = Array.from({ length: 14 }, () =>
      'position: absolute; left: ' + (20 + rnd() * 720).toFixed(0) + 'px; top: ' + (330 + rnd() * 160).toFixed(0) + 'px; width: 8px; height: 10px; background: ' + (rnd() > 0.5 ? '#f2a65a' : '#f6e7d0') + '; opacity: ' + (night ? 0.8 : 0) + '; transition: opacity 2s ease;');
    const names = ['YouTube', 'Netflix', 'Spotify', 'Xuper Hydra', 'Prime Video', 'Disney+'];
    const apps = names.map((name, i) => {
      const on = i === this.state.sel;
      return {
        name,
        mark: on ? '✎' : '·',
        pick: () => this.setState({ sel: i }),
        style: 'height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 0; cursor: pointer; text-align: left; font-family: "Caveat", cursive; font-size: 44px; line-height: 1; transition: transform 0.4s cubic-bezier(0.16,1,0.3,1); ' +
          'animation: lo-in 0.6s ' + (0.1 + i * 0.07).toFixed(2) + 's cubic-bezier(0.16,1,0.3,1) both; ' +
          (on ? 'background: rgba(242,166,90,0.45); color: #2a2350; font-weight: 700; border-radius: 10px; transform: translateX(10px);' : 'background: transparent; color: #4a3d6e; font-weight: 500;'),
      };
    });
    const clouds = [[60, 60, 200, 0.95, 34], [300, 150, 150, 0.8, 46], [560, 220, 180, 0.85, 40]].map(([x, y, w, a, dur]) =>
      'position: absolute; left: ' + x + 'px; top: ' + y + 'px; width: ' + w + 'px; height: ' + Math.round(w * 0.3) + 'px; border-radius: ' + w + 'px; background: rgba(255,255,255,' + a + '); box-shadow: ' + Math.round(w * 0.22) + 'px -' + Math.round(w * 0.12) + 'px 0 ' + Math.round(w * 0.02) + 'px rgba(255,255,255,' + a + '); opacity: ' + (night ? 0 : 1) + '; transition: opacity 2s ease; animation: lo-cloud ' + dur + 's ease-in-out infinite alternate;');
    return {
      rain, lights, apps, clouds, clock, date,
      brand: this.props.brand ?? 'JP-TV',
      whenLabel: night ? 'esta noche' : 'hoy',
      rootStyle: "width: 1920px; height: 1080px; position: relative; overflow: hidden; color: #f6e7d0; font-family: 'DM Mono', monospace; background: " + (night ? 'linear-gradient(180deg, #2a2350 0%, #1e1b3a 60%, #17142c 100%)' : 'linear-gradient(180deg, #6a69a6 0%, #55548c 60%, #45446f 100%)') + ';',
      windowStyle: 'position: absolute; left: 120px; top: 120px; width: 760px; height: 520px; border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 18px #3a2d4a, 0 30px 80px rgba(0,0,0,0.5); background: ' + (night ? 'linear-gradient(180deg, #3b2d5c 0%, #7a4a72 55%, #f2a65a 100%)' : 'linear-gradient(180deg, #5fb0ea 0%, #a8d8f5 55%, #fde6b8 100%)') + ';',
      orbStyle: 'position: absolute; left: 520px; top: 70px; width: 90px; height: 90px; border-radius: 50%; ' + (night ? 'background: #f6e7d0; box-shadow: 0 0 60px rgba(246,231,208,0.6);' : 'background: #fff3c4; box-shadow: 0 0 90px 20px rgba(255,236,170,0.9);'),
      bA: night ? '#231c3d' : '#7c8cbc',
      bB: night ? '#2a2148' : '#93a2cc',
      deskStyle: 'position: absolute; left: 0; right: 0; top: 760px; bottom: 0; background: ' + (night ? 'linear-gradient(180deg, #4a3047 0%, #331f33 100%)' : 'linear-gradient(180deg, #7a5266 0%, #593a4c 100%)') + ';',
      sunbeamStyle: 'position: absolute; left: 140px; top: 640px; width: 900px; height: 340px; pointer-events: none; clip-path: polygon(0 0, 80% 0, 100% 100%, 22% 100%); background: linear-gradient(180deg, rgba(255,236,190,0.32) 0%, rgba(255,236,190,0) 100%); opacity: ' + (night ? 0 : 1) + '; transition: opacity 2s ease;',
      lampWrapStyle: 'position: absolute; left: 820px; top: 520px; width: 640px; height: 520px; opacity: ' + (night ? 1 : 0) + '; transition: opacity 2s ease;',
    };
  }
}
</script>
